name: Validar Fortuna Real

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: "1 Programa"

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          lfs: true

      - name: Preparar Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: "1 Programa/package-lock.json"

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache de Rust
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: "1 Programa/src-tauri -> target"

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Validar versiones internas
        run: |
          $packageVersion = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -LiteralPath "src-tauri/Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Las versiones de package.json, tauri.conf.json y Cargo.toml deben coincidir."
          }

      - name: Comprobar tipos y política estática
        run: npm run lint

      - name: Comprobar tipos de scripts y pruebas
        run: npm run test:types

      - name: Ejecutar pruebas de dominio, persistencia y distribución
        run: npm test

      - name: Compilar frontend de producción
        run: npm run build

      - name: Verificar formato de Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Ejecutar pruebas de Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Ejecutar Clippy sin advertencias
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Confirmar política de firma local
        run: |
          Write-Host "Validación terminada."
          Write-Host "El instalador y las actualizaciones se compilan, firman y publican desde el computador autorizado."
          Write-Host "La clave de firma local no se guarda ni se solicita en GitHub Actions."
