name: Publicar Fortuna Real

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publicar-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache de Rust
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependencias
        run: npm ci

      - name: Validar versión y etiqueta
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -LiteralPath "src-tauri/Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Las versiones de package.json, tauri.conf.json y Cargo.toml deben coincidir."
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con v$packageVersion."
          }
          "version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Comprobar tipos y política estática
        run: npm run lint

      - name: Comprobar tipos de scripts y pruebas
        run: npm run test:types

      - name: Ejecutar pruebas de dominio, persistencia y release
        run: npm test

      - name: Compilar frontend de producción
        run: npm run build

      - name: Verificar formato de Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Ejecutar pruebas de Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Ejecutar Clippy sin advertencias
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Comprobar credenciales de firma
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Falta el secreto TAURI_SIGNING_PRIVATE_KEY."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Falta el secreto TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
          }

      - name: Compilar, firmar y publicar
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Fortuna Real v__VERSION__"
          releaseBody: "Nueva versión de Fortuna Real con mejoras y correcciones."
          releaseDraft: false
          prerelease: false

      - name: Verificar manifiesto y activos publicados
        shell: pwsh
        env:
          UPDATER_ENDPOINT: https://github.com/OscarD0823/Fortuna-Real/releases/latest/download/latest.json
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $manifest = $null
          for ($attempt = 1; $attempt -le 12; $attempt += 1) {
            try {
              $candidate = Invoke-RestMethod -Uri $env:UPDATER_ENDPOINT -TimeoutSec 20
              if ($candidate.version -eq $env:EXPECTED_VERSION) {
                $manifest = $candidate
                break
              }
            }
            catch {
              Write-Host "Intento $attempt: latest.json aún no está disponible."
            }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $manifest) {
            throw "El endpoint del actualizador no publicó la versión $env:EXPECTED_VERSION."
          }
          $platform = $manifest.platforms.'windows-x86_64'
          if ($null -eq $platform -or [string]::IsNullOrWhiteSpace($platform.signature)) {
            throw "latest.json no contiene plataforma windows-x86_64 y firma."
          }
          if ($platform.url -notmatch '^https://github\.com/.+/releases/download/') {
            throw "La URL del instalador no pertenece a un GitHub Release HTTPS."
          }
          foreach ($assetUrl in @($platform.url, "$($platform.url).sig")) {
            $response = Invoke-WebRequest -Uri $assetUrl -Method Head -MaximumRedirection 10 -TimeoutSec 30
            if ($response.StatusCode -ne 200) {
              throw "El activo $assetUrl devolvió HTTP $($response.StatusCode)."
            }
          }
